<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040814" />
      <stop offset="50%" stop-color="#0A1329" />
      <stop offset="100%" stop-color="#060C1B" />
    </linearGradient>

    <!-- Emirates Brand Accent Gradient -->
    <linearGradient id="emiratesRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D71921" />
      <stop offset="100%" stop-color="#FF3843" />
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#FFDF73" />
    </linearGradient>

    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#3A7BD5" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D71921" stop-opacity="0" />
      <stop offset="30%" stop-color="#D71921" stop-opacity="1" />
      <stop offset="50%" stop-color="#00D2FF" stop-opacity="1" />
      <stop offset="70%" stop-color="#D71921" stop-opacity="1" />
      <stop offset="100%" stop-color="#D71921" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.6; filter: drop-shadow(0 0 8px rgba(215, 25, 33, 0.4)); }
        50% { opacity: 1; filter: drop-shadow(0 0 20px rgba(0, 210, 255, 0.8)); }
      }
      @keyframes dashFlow {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatParticle {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.4; }
        50% { transform: translateY(-12px) scale(1.3); opacity: 0.9; }
      }
      @keyframes pulseBadge {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.03); }
      }
      .anim-glow { animation: pulseGlow 4s ease-in-out infinite; }
      .anim-dash { stroke-dasharray: 20 10; animation: dashFlow 25s linear infinite; }
      .anim-particle-1 { animation: floatParticle 3s ease-in-out infinite; }
      .anim-particle-2 { animation: floatParticle 4.5s ease-in-out infinite 1s; }
      .anim-particle-3 { animation: floatParticle 3.8s ease-in-out infinite 0.5s; }
      .anim-badge { animation: pulseBadge 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Grid Blueprint Pattern Background -->
  <g opacity="0.12" stroke="#38BDF8" stroke-width="0.75">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="340" x2="1200" y2="340" />

    <line x1="100" y1="0" x2="100" y2="380" />
    <line x1="250" y1="0" x2="250" y2="380" />
    <line x1="400" y1="0" x2="400" y2="380" />
    <line x1="550" y1="0" x2="550" y2="380" />
    <line x1="700" y1="0" x2="700" y2="380" />
    <line x1="850" y1="0" x2="850" y2="380" />
    <line x1="1000" y1="0" x2="1000" y2="380" />
    <line x1="1150" y1="0" x2="1150" y2="380" />
  </g>

  <!-- Decorative Orbit Lines -->
  <circle cx="1060" cy="90" r="140" fill="none" stroke="#D71921" stroke-width="1" opacity="0.2" />
  <circle cx="1060" cy="90" r="100" fill="none" stroke="#00D2FF" stroke-width="1.2" stroke-dasharray="8 6" opacity="0.35" class="anim-dash" />
  <circle cx="1060" cy="90" r="60" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.25" />

  <!-- Animated Particles -->
  <circle cx="1020" cy="60" r="4" fill="#00D2FF" class="anim-particle-1" filter="url(#softGlow)" />
  <circle cx="1110" cy="120" r="5" fill="#D71921" class="anim-particle-2" filter="url(#softGlow)" />
  <circle cx="980" cy="140" r="3.5" fill="#FFDF73" class="anim-particle-3" filter="url(#softGlow)" />
  <circle cx="120" cy="80" r="3" fill="#00D2FF" class="anim-particle-2" opacity="0.5" />
  <circle cx="180" cy="260" r="4" fill="#D71921" class="anim-particle-1" opacity="0.6" />

  <!-- Corner Tech Accents -->
  <path d="M 30,50 L 30,30 L 50,30" stroke="#D71921" stroke-width="3" fill="none" />
  <path d="M 1170,50 L 1170,30 L 1150,30" stroke="#00D2FF" stroke-width="3" fill="none" />
  <path d="M 30,330 L 30,350 L 50,350" stroke="#00D2FF" stroke-width="3" fill="none" />
  <path d="M 1170,330 L 1170,350 L 1150,350" stroke="#D71921" stroke-width="3" fill="none" />

  <!-- Top Badge: Emirates Group Enterprise AI -->
  <g transform="translate(60, 48)">
    <rect width="320" height="32" rx="16" fill="#131F38" stroke="#2A3F66" stroke-width="1.2" />
    <circle cx="20" cy="16" r="6" fill="#D71921" filter="url(#softGlow)" />
    <circle cx="20" cy="16" r="3" fill="#FFFFFF" />
    <text x="36" y="20" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.2">
      EMIRATES AIRLINE &amp; GROUP P2P
    </text>
    <rect x="238" y="7" width="70" height="18" rx="9" fill="#D71921" />
    <text x="273" y="19.5" fill="#FFFFFF" font-family="sans-serif" font-size="9.5" font-weight="800" text-anchor="middle" letter-spacing="0.5">
      AI-CORE
    </text>
  </g>

  <!-- Live Pulse Dot in Top Right -->
  <g transform="translate(1040, 52)">
    <circle cx="0" cy="0" r="5" fill="#10B981" filter="url(#softGlow)" />
    <circle cx="0" cy="0" r="10" fill="none" stroke="#10B981" stroke-width="1.5" opacity="0.6">
      <animate attributeName="r" values="6;16;6" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <text x="16" y="4" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="0.8">SYSTEM OPERATIONAL</text>
  </g>

  <!-- Main Platform Title -->
  <text x="60" y="145" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
    EMIRATES P2P <tspan fill="url(#emiratesRed)">INTELLIGENCE</tspan>
  </text>

  <!-- Animated Glowing Flow Line under Title -->
  <line x1="60" y1="168" x2="840" y2="168" stroke="url(#glowLine)" stroke-width="3" filter="url(#neonGlow)" class="anim-glow" />

  <!-- Subtitle & Value Proposition -->
  <text x="60" y="205" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="500" letter-spacing="0.4">
    Smart 3-Way Validation · Predictive Process Mining · Autonomous Invoice Triaging · Right-First-Time Spend Analytics
  </text>

  <!-- Bottom KPI Badges Bar -->
  <g transform="translate(60, 252)">
    <!-- KPI 1 -->
    <g transform="translate(0, 0)">
      <rect width="240" height="68" rx="12" fill="#0E192F" stroke="#1E2E4E" stroke-width="1.2" />
      <text x="20" y="32" fill="#38BDF8" font-family="monospace" font-size="24" font-weight="800">6,800,000+</text>
      <text x="20" y="52" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="0.8">BPI Event Logs Ingested</text>
    </g>

    <!-- KPI 2 -->
    <g transform="translate(255, 0)">
      <rect width="240" height="68" rx="12" fill="#0E192F" stroke="#1E2E4E" stroke-width="1.2" />
      <text x="20" y="32" fill="#10B981" font-family="monospace" font-size="24" font-weight="800">99.4%</text>
      <text x="20" y="52" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="0.8">3-Way Smart Match Rate</text>
    </g>

    <!-- KPI 3 -->
    <g transform="translate(510, 0)">
      <rect width="240" height="68" rx="12" fill="#0E192F" stroke="#1E2E4E" stroke-width="1.2" />
      <text x="20" y="32" fill="#F59E0B" font-family="monospace" font-size="24" font-weight="800">3.2x Faster</text>
      <text x="20" y="52" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="0.8">Invoice Cycle Throughput</text>
    </g>

    <!-- KPI 4 -->
    <g transform="translate(765, 0)">
      <rect width="315" height="68" rx="12" fill="#0E192F" stroke="#D71921" stroke-width="1.2" opacity="0.95" />
      <circle cx="32" cy="34" r="14" fill="#D71921" opacity="0.2" />
      <text x="32" y="39" fill="#FF3843" font-family="sans-serif" font-size="16" font-weight="900" text-anchor="middle">✓</text>
      <text x="58" y="32" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="800">Zero Maverick Spend</text>
      <text x="58" y="52" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="500">Autonomous Conformance Engine</text>
    </g>
  </g>
</svg>
