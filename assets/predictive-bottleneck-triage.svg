<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="100%" height="100%">
  <defs>
    <linearGradient id="triageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050916" />
      <stop offset="50%" stop-color="#0A1224" />
      <stop offset="100%" stop-color="#040813" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>

    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>

    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="neonGlowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes streamFlow {
        from { stroke-dashoffset: 240; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulseBar {
        0%, 100% { width: 95px; }
        50% { width: 125px; }
      }
      @keyframes blinkLight {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
      .anim-stream { stroke-dasharray: 8 6; animation: streamFlow 4s linear infinite; }
      .anim-bar { animation: pulseBar 3s ease-in-out infinite; }
      .blink-alert { animation: blinkLight 1.5s infinite; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1100" height="480" rx="16" fill="url(#triageBg)" stroke="#1E293B" stroke-width="1.2" />

  <!-- Grid Blueprint Lines -->
  <g opacity="0.08" stroke="#38BDF8" stroke-width="0.8">
    <line x1="0" y1="80" x2="1100" y2="80" />
    <line x1="0" y1="240" x2="1100" y2="240" />
    <line x1="0" y1="400" x2="1100" y2="400" />
    <line x1="280" y1="0" x2="280" y2="480" />
    <line x1="560" y1="0" x2="560" y2="480" />
    <line x1="840" y1="0" x2="840" y2="480" />
  </g>

  <!-- Title Header -->
  <g transform="translate(50, 42)">
    <rect width="40" height="40" rx="10" fill="#181336" stroke="#372670" stroke-width="1" />
    <text x="20" y="26" fill="#8B5CF6" font-family="sans-serif" font-size="20" font-weight="900" text-anchor="middle">🧠</text>
    <text x="54" y="20" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="800">
      PREDICTIVE BOTTLENECK TRIAGE &amp; ANOMALY PIPELINE
    </text>
    <text x="54" y="38" fill="#64748B" font-family="sans-serif" font-size="12" font-weight="500">
      Dual Ensemble ML: Gradient Boosted Trees for Cycle Delays · Isolation Forest for Maverick Spend
    </text>
  </g>

  <!-- Stream Connectors -->
  <!-- Stream 1 to 2 -->
  <path d="M 260,240 L 330,240" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" class="anim-stream" />
  <!-- Stream 2 to 3 (Upper & Lower) -->
  <path d="M 540,240 L 580,240 L 580,180 L 620,180" fill="none" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round" class="anim-stream" />
  <path d="M 540,240 L 580,240 L 580,310 L 620,310" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" class="anim-stream" />
  <!-- Stream 3 to 4 -->
  <path d="M 830,180 L 870,180 L 870,240 L 900,240" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" class="anim-stream" />
  <path d="M 830,310 L 870,310 L 870,240 L 900,240" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" class="anim-stream" />

  <!-- ==================== STAGE 1: REAL-TIME EVENT STREAM ==================== -->
  <g transform="translate(50, 130)">
    <rect width="210" height="230" rx="14" fill="#0C162E" stroke="#1E3258" stroke-width="1.5" filter="url(#boxShadow)" />
    <rect x="14" y="14" width="28" height="28" rx="8" fill="#132342" />
    <text x="28" y="33" fill="#38BDF8" font-family="monospace" font-size="13" font-weight="800" text-anchor="middle">01</text>
    <text x="50" y="32" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="700" text-transform="uppercase">Input Stream</text>

    <text x="14" y="70" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="700">P2P Event</text>
    <text x="14" y="90" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="700">Telemetry</text>

    <g transform="translate(14, 115)" font-family="monospace" font-size="10.5">
      <rect x="0" y="0" width="180" height="24" rx="4" fill="#071020" stroke="#172744" stroke-width="1" />
      <text x="8" y="16" fill="#38BDF8">PO_RECORD_MODIFY</text>

      <rect x="0" y="30" width="180" height="24" rx="4" fill="#071020" stroke="#172744" stroke-width="1" />
      <text x="8" y="46" fill="#F59E0B">GR_GATE_RECEIPT</text>

      <rect x="0" y="60" width="180" height="24" rx="4" fill="#071020" stroke="#172744" stroke-width="1" />
      <text x="8" y="76" fill="#10B981">INVOICE_CLEARANCE</text>
    </g>

    <text x="14" y="215" fill="#64748B" font-family="sans-serif" font-size="10">Throughput: 14,200 ev/sec</text>
  </g>

  <!-- ==================== STAGE 2: FEATURE ENGINEERING ==================== -->
  <g transform="translate(330, 130)">
    <rect width="210" height="230" rx="14" fill="#0C162E" stroke="#1E3258" stroke-width="1.5" filter="url(#boxShadow)" />
    <rect x="14" y="14" width="28" height="28" rx="8" fill="#132342" />
    <text x="28" y="33" fill="#38BDF8" font-family="monospace" font-size="13" font-weight="800" text-anchor="middle">02</text>
    <text x="50" y="32" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="700" text-transform="uppercase">Vectorization</text>

    <text x="14" y="70" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="700">Dynamic Feature</text>
    <text x="14" y="90" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="700">Extractor</text>

    <g transform="translate(14, 115)" font-family="sans-serif" font-size="11">
      <text y="0" fill="#64748B">• Approver Queue Lag</text>
      <text y="20" fill="#64748B">• Line Item Volatility</text>
      <text y="40" fill="#64748B">• Vendor Historical SLA</text>
      <text y="60" fill="#64748B">• Department Maverick Ratio</text>
      <text y="80" fill="#64748B">• Spend Discrepancy Index</text>
    </g>

    <rect x="14" y="212" width="180" height="4" rx="2" fill="url(#cyanGrad)" />
  </g>

  <!-- ==================== STAGE 3: DUAL ML ENSEMBLE ==================== -->
  <!-- Model 3A: Delay Predictor -->
  <g transform="translate(620, 110)">
    <rect width="210" height="115" rx="12" fill="#170F2C" stroke="#8B5CF6" stroke-width="1.5" filter="url(#boxShadow)" />
    <rect x="12" y="12" width="22" height="22" rx="6" fill="#2E1C55" />
    <text x="23" y="27" fill="#8B5CF6" font-family="monospace" font-size="11" font-weight="800" text-anchor="middle">A</text>
    <text x="42" y="27" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="700">Cycle Delay GBDT</text>

    <text x="12" y="55" fill="#C4B5FD" font-family="sans-serif" font-size="11">Lead-Time Regression</text>
    <g transform="translate(12, 65)">
      <rect width="186" height="18" rx="4" fill="#0C0719" />
      <rect width="138" height="18" rx="4" fill="url(#purpleGrad)" />
      <text x="8" y="13" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="700">ROC-AUC: 0.942</text>
      <text x="150" y="13" fill="#A78BFA" font-family="monospace" font-size="10">88%</text>
    </g>
    <text x="12" y="102" fill="#8B5CF6" font-family="monospace" font-size="10">Predicted Delay: +3.4 days</text>
  </g>

  <!-- Model 3B: Anomaly Detector -->
  <g transform="translate(620, 245)">
    <rect width="210" height="115" rx="12" fill="#261705" stroke="#F59E0B" stroke-width="1.5" filter="url(#boxShadow)" />
    <rect x="12" y="12" width="22" height="22" rx="6" fill="#422707" />
    <text x="23" y="27" fill="#F59E0B" font-family="monospace" font-size="11" font-weight="800" text-anchor="middle">B</text>
    <text x="42" y="27" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="700">Maverick Anomaly IF</text>

    <text x="12" y="55" fill="#FDE68A" font-family="sans-serif" font-size="11">Isolation Forest Classifier</text>
    <g transform="translate(12, 65)">
      <rect width="186" height="18" rx="4" fill="#140B01" />
      <rect width="165" height="18" rx="4" fill="url(#orangeGrad)" />
      <text x="8" y="13" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="700">F1 Score: 0.916</text>
      <text x="145" y="13" fill="#FDE68A" font-family="monospace" font-size="10">92%</text>
    </g>
    <text x="12" y="102" fill="#F59E0B" font-family="monospace" font-size="10">Outlier Score: 0.08 (Clean)</text>
  </g>

  <!-- ==================== STAGE 4: PRESCRIPTIVE TRIAGE ACTION ==================== -->
  <g transform="translate(900, 130)">
    <rect width="170" height="230" rx="14" fill="#08211A" stroke="#10B981" stroke-width="1.5" filter="url(#boxShadow)" />
    <rect x="14" y="14" width="28" height="28" rx="8" fill="#0C3B2E" />
    <text x="28" y="33" fill="#10B981" font-family="monospace" font-size="13" font-weight="800" text-anchor="middle">✓</text>
    <text x="50" y="32" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="700" text-transform="uppercase">Prescription</text>

    <text x="14" y="70" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="700">Autonomous</text>
    <text x="14" y="90" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="700">Intervention</text>

    <g transform="translate(14, 115)" font-family="sans-serif" font-size="10.5">
      <rect x="0" y="0" width="142" height="28" rx="6" fill="#0C3B2E" stroke="#10B981" stroke-width="1" />
      <text x="8" y="18" fill="#A7F3D0" font-weight="700">Dynamic Load Shift</text>

      <rect x="0" y="36" width="142" height="28" rx="6" fill="#0C3B2E" stroke="#10B981" stroke-width="1" />
      <text x="8" y="54" fill="#A7F3D0" font-weight="700">Auto-Remind Supplier</text>

      <rect x="0" y="72" width="142" height="28" rx="6" fill="#0C3B2E" stroke="#10B981" stroke-width="1" />
      <text x="8" y="90" fill="#A7F3D0" font-weight="700">SLA Bypass Trigger</text>
    </g>

    <text x="14" y="218" fill="#34D399" font-family="sans-serif" font-size="10" font-weight="600">Saved: 4.8 hrs / case</text>
  </g>

  <!-- Bottom Telemetry Footer -->
  <g transform="translate(50, 420)">
    <circle cx="6" cy="6" r="4" fill="#10B981" class="blink-alert" />
    <text x="18" y="10" fill="#94A3B8" font-family="sans-serif" font-size="11">
      Continuous Retraining Active · Pipeline Latency: <tspan fill="#38BDF8" font-family="monospace">18ms</tspan> · Real-Time Isolation Forest Threshold: <tspan fill="#F59E0B" font-family="monospace">0.15</tspan> · GBDT Regressor Tree Depth: <tspan fill="#A78BFA" font-family="monospace">6</tspan>
    </text>
  </g>
</svg>
